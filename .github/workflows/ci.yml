name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pytest

      - name: Run norm_common tests
        working-directory: scripts
        run: python -m pytest test_norm_common.py -v

      - name: Check CLI parses
        working-directory: scripts
        run: python archive_cli.py --help

  validate-skill-md:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate SKILL.md frontmatter
        run: |
          # 校验 SKILL.md 存在且有 name/description 元数据
          test -f SKILL.md
          grep -q "^name:" SKILL.md
          grep -q "^description:" SKILL.md
          echo "SKILL.md frontmatter OK"

      - name: Validate files present
        run: |
          for f in README.md LICENSE references/format.md references/format-adaptation.md references/ocr-fixes.md scripts/norm_common.py scripts/archive_cli.py; do
            test -f "$f" && echo "OK $f" || { echo "MISSING $f"; exit 1; }
          done
